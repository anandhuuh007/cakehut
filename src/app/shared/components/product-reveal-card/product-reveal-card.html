<div 
  [routerLink]="['/products', id]"
  [ngClass]="{'hover:-translate-y-2 hover:scale-[1.03] transition-all duration-500 ease-out': enableAnimations}"
  class="relative w-80 rounded-2xl border border-zinc-200/50 bg-white text-zinc-900 overflow-hidden shadow-lg shadow-black/5 cursor-pointer group">
  
  <!-- Image Container -->
  <div class="relative overflow-hidden">
    <img
      [src]="image"
      [alt]="name"
      [ngClass]="{'group-hover:scale-110': enableAnimations}"
      class="h-56 w-full object-cover transition-transform duration-500 ease-out"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-black/30 via-transparent to-transparent"></div>
    
    <!-- Favorite Button -->
    <button
      (click)="toggleFavorite($event)"
      [ngClass]="{
        'bg-red-500 text-white border-red-500': isFavorite,
        'bg-white/20 text-white border-white/20 hover:bg-white/30': !isFavorite,
        'animate-heart': isFavoriting
      }"
      class="absolute top-4 right-4 p-2 rounded-full backdrop-blur-sm border transition-all duration-300 z-10">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
           [ngClass]="{'fill-current': isFavorite}" class="w-4 h-4">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
      </svg>
    </button>

    <!-- Badges Container -->
    <div class="absolute top-4 left-4 flex flex-col gap-1.5 z-10 items-start">
      <div
        *ngIf="badgeText"
        class="bg-amber-400 text-amber-950 px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-widest shadow-md">
        {{ badgeText }}
      </div>
      <div
        *ngIf="originalPrice && discountPercent > 0"
        class="bg-red-500 text-white px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider shadow-md">
        {{ discountPercent }}% OFF
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="p-6 space-y-3">
    <!-- Rating -->
    <div class="flex items-center gap-2">
      <div class="flex text-yellow-400">
        <svg *ngFor="let starIndex of [0, 1, 2, 3, 4]" 
             xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" 
             [ngClass]="{
               'fill-current text-yellow-400': starIndex < ratingFloor,
               'text-zinc-300': starIndex >= ratingFloor
             }"
             class="w-4 h-4">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>
      <span class="text-sm text-zinc-500">
        {{ rating }} ({{ reviewCount }} reviews)
      </span>
    </div>

    <!-- Product Info -->
    <div class="space-y-1">
      <h3 class="text-xl font-bold leading-tight tracking-tight hover:opacity-90 transition-opacity">
        {{ name }}
      </h3>
      
      <div class="flex items-center gap-2">
        <span class="text-2xl font-bold text-primary">{{ price }}</span>
        <span *ngIf="originalPrice" class="text-lg text-zinc-400 line-through">
          {{ originalPrice }}
        </span>
      </div>
    </div>
  </div>

  <!-- Reveal Overlay -->
  <div
    [ngClass]="{'group-hover:translate-y-0 group-hover:opacity-100 group-hover:blur-none': enableAnimations}"
    class="absolute inset-0 bg-white/96 backdrop-blur-xl flex flex-col justify-end translate-y-full opacity-0 blur-sm transition-all duration-500 ease-out z-20">
    
    <div class="p-6 space-y-4">
      <!-- Product Details -->
      <div [ngClass]="{'group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-500 delay-75': enableAnimations}"
           class="opacity-0 translate-y-4 duration-500">
        <h4 class="font-semibold mb-2 text-zinc-800">Product Details</h4>
        <p class="text-sm text-zinc-500 leading-relaxed">
          {{ description }}
        </p>
      </div>

      <!-- Features -->
      <div [ngClass]="{'group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-500 delay-150': enableAnimations}"
           class="opacity-0 translate-y-4 duration-500">
        <div class="grid grid-cols-2 gap-3 text-xs">
          <div class="bg-zinc-100 rounded-lg p-2 text-center">
            <div class="font-semibold text-zinc-700">Premium Quality</div>
            <div class="text-zinc-500">Handcrafted</div>
          </div>
          <div class="bg-zinc-100 rounded-lg p-2 text-center">
            <div class="font-semibold text-zinc-700">Fresh Daily</div>
            <div class="text-zinc-500">Natural Ingredients</div>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div [ngClass]="{'group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-500 delay-200': enableAnimations}"
           class="space-y-3 opacity-0 translate-y-4 duration-500">
        <button
          [routerLink]="['/products', id]"
          class="w-full h-12 font-medium flex items-center justify-center rounded-md bg-gradient-to-r from-primary to-primary/90 hover:from-primary/95 hover:to-primary text-white shadow-lg shadow-primary/25 hover:shadow-primary/30 transition-all active:scale-95">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2">
            <rect width="20" height="14" x="2" y="5" rx="2"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
          Buy Now
        </button>
        
        <button
          [routerLink]="['/products', id]"
          class="w-full h-10 font-medium flex items-center justify-center rounded-md border border-zinc-200 hover:bg-zinc-50 transition-colors">
          View Details
        </button>
      </div>
    </div>
  </div>
</div>
