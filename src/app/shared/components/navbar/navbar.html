<header>
  <nav
    [attr.data-state]="menuState ? 'active' : null"
    class="group bg-zinc-100/90 fixed z-20 top-0 left-0 w-full border-b border-zinc-200/80 backdrop-blur-md text-zinc-900">
    <div class="w-full px-6 md:px-12 lg:px-20 transition-all duration-300">
      <div class="relative flex flex-wrap items-center justify-between gap-6 py-3 lg:gap-0 lg:py-4">
        <div class="flex w-full items-center justify-between gap-12 lg:w-auto">
          <!-- Text Logo without Emoji -->
          <a routerLink="/" aria-label="home" class="flex items-center">
            <span class="font-bold text-xl tracking-wider text-primary">Sweet Layers</span>
          </a>

          <!-- Mobile toggle button -->
          <button
            (click)="toggleMenu()"
            [attr.aria-label]="menuState ? 'Close Menu' : 'Open Menu'"
            class="relative z-20 -m-2.5 -mr-4 block cursor-pointer p-2.5 lg:hidden text-zinc-700">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              [ngClass]="{'rotate-180 scale-0 opacity-0': menuState, 'rotate-0 scale-100 opacity-100': !menuState}"
              class="m-auto size-6 duration-200">
              <line x1="4" x2="20" y1="12" y2="12" />
              <line x1="4" x2="20" y1="6" y2="6" />
              <line x1="4" x2="20" y1="18" y2="18" />
            </svg>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              [ngClass]="{'rotate-0 scale-100 opacity-100': menuState, '-rotate-180 scale-0 opacity-0': !menuState}"
              class="absolute inset-0 m-auto size-6 duration-200">
              <line x1="18" x2="6" y1="6" y2="18" />
              <line x1="6" x2="18" y1="6" y2="18" />
            </svg>
          </button>

          <!-- Desktop Links -->
          <div class="hidden lg:block">
            <ul class="flex gap-10 text-sm">
              <li>
                <a routerLink="/" class="text-zinc-600 hover:text-primary font-semibold block duration-150">Home</a>
              </li>
              <li>
                <a routerLink="/products" class="text-zinc-600 hover:text-primary font-semibold block duration-150">Cakes</a>
              </li>
              <li>
                <a routerLink="/orders" class="text-zinc-600 hover:text-primary font-semibold block duration-150">Orders</a>
              </li>
              <li>
                <a routerLink="/cart" class="text-zinc-600 hover:text-primary font-semibold block duration-150">Cart</a>
              </li>
            </ul>
          </div>
        </div>

        <!-- Right Side Nav -->
        <div
          [ngClass]="{'block': menuState, 'hidden': !menuState}"
          class="bg-zinc-100 group-data-[state=active]:block lg:group-data-[state=active]:flex mb-6 w-full flex-wrap items-center justify-end space-y-8 rounded-3xl border border-zinc-200 lg:border-transparent p-6 shadow-2xl md:flex-nowrap lg:m-0 lg:flex lg:w-fit lg:gap-6 lg:space-y-0 lg:bg-transparent lg:p-0 lg:shadow-none">
          <div class="lg:hidden">
            <ul class="space-y-6 text-base">
              <li>
                <a routerLink="/" class="text-zinc-600 hover:text-primary font-semibold block duration-150">Home</a>
              </li>
              <li>
                <a routerLink="/products" class="text-zinc-600 hover:text-primary font-semibold block duration-150">Cakes</a>
              </li>
              <li>
                <a routerLink="/orders" class="text-zinc-600 hover:text-primary font-semibold block duration-150">Orders</a>
              </li>
              <li>
                <a routerLink="/cart" class="text-zinc-600 hover:text-primary font-semibold block duration-150">Cart</a>
              </li>
            </ul>
          </div>
          <div class="flex w-full flex-col space-y-3 sm:flex-row sm:gap-6 sm:space-y-0 md:w-fit">
            <a
              routerLink="/auth"
              class="inline-flex items-center justify-center whitespace-nowrap rounded-full text-sm font-semibold transition-all text-zinc-700 hover:text-primary hover:bg-zinc-200/40 h-9 px-5 active:scale-95">
              Login
            </a>
            <a
              routerLink="/auth"
              class="inline-flex items-center justify-center whitespace-nowrap rounded-full text-sm font-semibold transition-all bg-primary text-primary-foreground hover:bg-primary/95 shadow-sm hover:shadow-md hover:-translate-y-0.5 active:scale-95 h-9 px-5">
              Sign Up
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
