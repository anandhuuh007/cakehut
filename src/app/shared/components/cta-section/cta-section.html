<section class="relative flex w-full flex-col overflow-hidden bg-white text-zinc-900 md:flex-row my-24 border-y border-zinc-100">
  <!-- Left Side: Content -->
  <div class="flex w-full flex-col justify-center p-8 md:w-1/2 md:p-12 lg:w-3/5 lg:p-16 z-10">
    <div>
      <main class="animate-fade-in-up stagger-1">
        <h2 class="text-4xl font-extrabold leading-tight tracking-tight text-zinc-900 md:text-5xl lg:text-6xl">
          {{ titleLine1 }} <br />
          <app-gradient-text>{{ titleLine2 }}</app-gradient-text>
        </h2>
        <div class="my-8 h-1.5 w-24 bg-primary rounded-full animate-scale-in stagger-2"></div>
        <p class="mb-10 max-w-md text-lg text-zinc-500 leading-relaxed animate-fade-in-up stagger-3">
          {{ subtitle }}
        </p>
        <div class="animate-fade-in-up stagger-4">
          <a [routerLink]="ctaLink" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-bold tracking-widest uppercase transition-all bg-primary text-primary-foreground hover:bg-primary/90 active:scale-95 h-14 px-10 shadow-lg shadow-primary/20">
            {{ ctaText }}
          </a>
        </div>
      </main>
    </div>

    <!-- Bottom Section: Footer Info -->
    <footer class="mt-20 w-full animate-fade-in-up stagger-5 border-t border-zinc-100 pt-8">
      <div class="grid grid-cols-1 gap-6 text-sm text-zinc-500 sm:grid-cols-3 font-medium">
        <div class="flex items-center hover:text-primary transition-colors cursor-pointer group">
          <div class="mr-3 flex-shrink-0 bg-primary/10 p-2 rounded-full group-hover:bg-primary group-hover:text-white transition-colors text-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" x2="22" y1="12" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </div>
          <span>{{ contactInfo.website }}</span>
        </div>
        <div class="flex items-center hover:text-primary transition-colors cursor-pointer group">
          <div class="mr-3 flex-shrink-0 bg-primary/10 p-2 rounded-full group-hover:bg-primary group-hover:text-white transition-colors text-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </div>
          <span>{{ contactInfo.phone }}</span>
        </div>
        <div class="flex items-center hover:text-primary transition-colors cursor-pointer group">
          <div class="mr-3 flex-shrink-0 bg-primary/10 p-2 rounded-full group-hover:bg-primary group-hover:text-white transition-colors text-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </div>
          <span>{{ contactInfo.address }}</span>
        </div>
      </div>
    </footer>
  </div>

  <!-- Right Side: Image with Clip Path Animation -->
  <div 
    class="w-full min-h-[400px] bg-cover bg-center md:absolute md:right-0 md:top-0 md:bottom-0 md:w-1/2 lg:w-2/5 animate-clip-path"
    [style.backgroundImage]="'url(' + backgroundImage + ')'">
  </div>
</section>
