<section class="bg-white py-24 relative overflow-hidden border-t border-zinc-200/50">
  <div class="max-w-7xl mx-auto px-6 md:px-12 lg:px-20 relative z-10">
    <div class="flex flex-col items-center justify-center max-w-2xl mx-auto opacity-0 translate-y-4 animate-fade-in-up">
      <div class="flex justify-center">
        <span class="text-xs font-bold uppercase tracking-widest text-primary bg-primary/10 px-3 py-1 rounded-full inline-block mb-3 shadow-sm">
          Testimonials
        </span>
      </div>

      <h2 class="text-3xl md:text-4xl font-bold tracking-tight mt-1 text-center text-zinc-900">
        What our users say
      </h2>
      <p class="text-center mt-4 text-zinc-500">
        See what our customers have to say about our handcrafted creations and exceptional service.
      </p>
    </div>

    <!-- 
      We add a gradient mask to fade out the top and bottom of the scrolling lists 
    -->
    <div class="flex justify-center gap-6 mt-16 h-[640px] overflow-hidden mask-gradient relative">
      <app-testimonials-column [testimonials]="firstColumn" [duration]="20"></app-testimonials-column>
      <app-testimonials-column [testimonials]="secondColumn" className="hidden md:block" [duration]="25"></app-testimonials-column>
      <app-testimonials-column [testimonials]="thirdColumn" className="hidden lg:block" [duration]="22"></app-testimonials-column>
      
      <!-- Gradient overlays as a fallback for browsers not supporting mask-image -->
      <div class="absolute inset-x-0 top-0 h-24 bg-gradient-to-b from-white to-transparent pointer-events-none z-10"></div>
      <div class="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-white to-transparent pointer-events-none z-10"></div>
    </div>
  </div>
</section>
