<div class="min-h-screen bg-zinc-50 pt-28 pb-20">
  <div class="max-w-7xl mx-auto px-6 md:px-12 lg:px-20">
    
    <!-- Page Header & Filters -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12">
      <div>
        <span class="text-xs font-bold uppercase tracking-widest text-primary bg-primary/10 px-3 py-1 rounded-full inline-block mb-3">
          Our Full Menu
        </span>
        <h1 class="text-3xl md:text-4xl font-bold text-zinc-900 tracking-tight">
          Explore Our Cake Creations
        </h1>
        <p class="mt-2 text-zinc-500">
          Find your perfect cake from our complete selection of fresh, handcrafted delights.
        </p>
      </div>

      <!-- Controls (Search & Sort) -->
      <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
        <!-- Search Input -->
        <div class="relative flex-grow sm:w-64">
          <input
            type="text"
            placeholder="Search cakes..."
            (input)="onSearch($event)"
            class="w-full pl-10 pr-4 py-2.5 bg-white border border-zinc-200 rounded-xl text-sm text-zinc-800 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all shadow-sm"
          />
          <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-3.5 w-4 h-4 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>

        <!-- Sort Select -->
        <div class="relative sm:w-48">
          <select
            (change)="onSortChange($event)"
            class="w-full px-4 py-2.5 bg-white border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all appearance-none cursor-pointer shadow-sm text-zinc-700"
          >
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Top Rated</option>
          </select>
          <svg xmlns="http://www.w3.org/2000/svg" class="absolute right-3 top-3.5 w-4 h-4 text-zinc-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
    </div>

    <!-- Category Filters -->
    <div class="flex flex-wrap items-center justify-center gap-3 mb-12">
      <button 
        *ngFor="let category of categories"
        (click)="setCategory(category)"
        [class]="selectedCategory === category ? 'bg-primary text-primary-foreground shadow-md' : 'bg-white text-zinc-600 hover:bg-zinc-100 border border-zinc-200'"
        class="px-5 py-2 rounded-full text-sm font-semibold transition-all cursor-pointer whitespace-nowrap"
      >
        {{ category }}
      </button>
    </div>

    <!-- Products Grid -->
    <div class="flex flex-wrap justify-center gap-8" *ngIf="filteredProducts.length > 0">
      <app-product-reveal-card
        *ngFor="let product of filteredProducts"
        [id]="product.id || product.name"
        [badgeText]="product.soldOut ? 'Sold Out' : (product.featured ? 'Featured' : (product.category || 'Classic'))"
        [name]="product.name"
        [price]="'$' + product.price"
        [originalPrice]="product.discount ? '$' + (product.price + product.discount) : undefined"
        [image]="product.image"
        [description]="product.description"
        [rating]="4.9"
        [reviewCount]="100 + (product.price * 2)"
      >
      </app-product-reveal-card>
    </div>

    <!-- Empty State -->
    <div class="text-center py-20 bg-white rounded-3xl border border-zinc-200/50 shadow-sm max-w-md mx-auto" *ngIf="filteredProducts.length === 0">
      <div class="inline-flex p-4 rounded-full bg-zinc-50 border border-zinc-100 text-zinc-400 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <h3 class="font-bold text-zinc-900 text-lg">No Cakes Found</h3>
      <p class="text-zinc-500 text-sm mt-1 px-4">
        We couldn't find any cakes matching "{{ searchQuery }}". Try checking your spelling or looking for another flavor!
      </p>
    </div>

  </div>
</div>
