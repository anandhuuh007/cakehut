<div class="min-h-screen bg-zinc-50 pt-28 pb-20">
  <div class="max-w-7xl mx-auto px-6 md:px-12 lg:px-20">

    <!-- Back to Details Link -->
    <a [routerLink]="product ? ['/products', product.id] : '/products'" class="inline-flex items-center text-sm font-semibold text-zinc-500 hover:text-primary transition-colors mb-8 group">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-2 transform group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to Product
    </a>

    <h1 class="text-3xl md:text-4xl font-extrabold text-zinc-900 tracking-tight mb-10">Checkout</h1>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
      
      <!-- Left Column: Delivery Form -->
      <div class="lg:col-span-7 bg-white rounded-3xl border border-zinc-200/50 shadow-sm p-8 space-y-6">
        <h2 class="text-xl font-bold text-zinc-900 border-b border-zinc-100 pb-4">Delivery Information</h2>
        
        <form (ngSubmit)="onSubmit()" class="space-y-5">
          <!-- Customer Name -->
          <div>
            <label for="customerName" class="block text-xs font-bold text-zinc-400 uppercase tracking-widest mb-2">Full Name</label>
            <input 
              type="text" 
              id="customerName" 
              name="customerName" 
              [(ngModel)]="customerName" 
              required
              placeholder="e.g. John Doe"
              class="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-zinc-800"
            />
          </div>

          <!-- Customer Phone -->
          <div>
            <label for="customerPhone" class="block text-xs font-bold text-zinc-400 uppercase tracking-widest mb-2">Phone Number</label>
            <input 
              type="tel" 
              id="customerPhone" 
              name="customerPhone" 
              [(ngModel)]="customerPhone" 
              required
              placeholder="e.g. +1 (555) 000-0000"
              class="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-zinc-800"
            />
          </div>

          <!-- Customer Pincode -->
          <div>
            <label for="customerPincode" class="block text-xs font-bold text-zinc-400 uppercase tracking-widest mb-2">Pincode</label>
            <input 
              type="text" 
              id="customerPincode" 
              name="customerPincode" 
              [(ngModel)]="customerPincode" 
              required
              placeholder="e.g. 100001"
              class="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-zinc-800"
            />
          </div>

          <!-- Customer Address -->
          <div>
            <label for="customerAddress" class="block text-xs font-bold text-zinc-400 uppercase tracking-widest mb-2">Delivery Address</label>
            <textarea 
              id="customerAddress" 
              name="customerAddress" 
              rows="4" 
              [(ngModel)]="customerAddress" 
              required
              placeholder="Enter your complete street address, apartment, city, and zip code"
              class="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-zinc-800 resize-none"
            ></textarea>
          </div>

          <!-- Hidden Submit for Enter Key functionality -->
          <button type="submit" class="hidden"></button>
        </form>
      </div>

      <!-- Right Column: Order Summary Card -->
      <div class="lg:col-span-5 bg-white rounded-3xl border border-zinc-200/50 shadow-sm overflow-hidden p-8 space-y-6">
        <h2 class="text-xl font-bold text-zinc-900 border-b border-zinc-100 pb-4">Order Summary</h2>

        <div *ngIf="product" class="flex gap-4 items-center">
          <!-- Product Image -->
          <div class="w-24 h-24 rounded-2xl overflow-hidden bg-zinc-100 border border-zinc-200/40 flex-shrink-0">
            <img [src]="product.image" [alt]="product.name" class="w-full h-full object-cover" />
          </div>
          
          <!-- Product Details -->
          <div class="space-y-1">
            <h3 class="font-bold text-zinc-950 text-base leading-snug">{{ product.name }}</h3>
            <div class="flex flex-wrap gap-2 text-xs font-medium text-zinc-500">
              <span class="bg-zinc-100 px-2 py-0.5 rounded-md">Weight: {{ weight }}</span>
              <span class="bg-zinc-100 px-2 py-0.5 rounded-md">Qty: {{ quantity }}</span>
            </div>
          </div>
        </div>

        <!-- Price Breakdown -->
        <div class="space-y-3 pt-4 border-t border-zinc-100 text-sm font-medium text-zinc-600">
          <div class="flex justify-between">
            <span>Cake Subtotal</span>
            <span>${{ totalPrice }}</span>
          </div>
          <div class="flex justify-between">
            <span>Standard Shipping</span>
            <span class="text-emerald-600 font-bold">FREE</span>
          </div>
          <div class="flex justify-between text-zinc-950 text-lg font-extrabold pt-3 border-t border-zinc-100">
            <span>Total Price</span>
            <span class="text-primary">${{ totalPrice }}</span>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="button"
            (click)="onSubmit()"
            class="w-full h-14 bg-gradient-to-r from-primary to-primary/90 hover:from-primary/95 hover:to-primary text-white font-bold rounded-2xl shadow-xl shadow-primary/25 hover:shadow-primary/30 transition-all duration-300 flex items-center justify-center gap-3 active:scale-[0.98]"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
              <rect width="20" height="14" x="2" y="5" rx="2"/>
              <line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
            Place Order Now
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
